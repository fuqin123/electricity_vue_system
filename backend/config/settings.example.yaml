  - { code: E-AUX-14, name: 冰水泵及塔2+小冰水机电表,               kind: elec, scope: line, role: aux, node: AUX-CARB-AIR, usage_type: 辅机用电, device_name: 冰水机和水塔, gateway: GW-PDB-4,   slave: 14, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-AUX-3-10, name: 4号高压机+3号吹瓶冰水机电表,          kind: elec, scope: line, role: aux, node: AUX-CARB-AIR, usage_type: 辅机用电, device_name: 高压机和冰水机, gateway: GW-PDB-3, slave: 10, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
