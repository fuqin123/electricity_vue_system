# ══════════════════════════════════════════════════════════════
# 能源产效管理系统 · 后端配置示例
#
# 使用方式：
#   cp config/settings.example.yaml config/settings.local.yaml
#   然后填写真实值。settings.local.yaml 已在 .gitignore 中，不会入库。
#
# 配置优先级（《项目规范》5.3）：环境变量 > 配置文件 > 默认值
#   常用环境变量：EEP_DB_PASSWORD / EEP_DB_HOST / EEP_SECRET_KEY / EEP_DEBUG
#
# ⚠ 严禁把生产口令、平台 token 提交进代码库。
#   下面的 gateways / meters 就是「现场设备登记表」——
#   改完执行 `python manage.py seed_registry` 同步进数据库（幂等，可重复跑）。
# ══════════════════════════════════════════════════════════════

app:
  name: 能源产效管理系统
  code: PLANT01
  env: development
  debug: false
  allowed_hosts:
    - 127.0.0.1
    - localhost

# ── 数据库（MySQL）───────────────────────────────────────────
database:
  engine: mysql
  host: 127.0.0.1
  port: 3306
  name: eep_energy
  user: root
  password: CHANGE_ME         # ← 用环境变量 EEP_DB_PASSWORD 覆盖，不要在此写真实口令
  conn_max_age: 60

# ── 跨域（大屏 / 后台分属不同端口）───────────────────────────
cors:
  allowed_origins:
    - http://127.0.0.1:5173   # 大屏开发服务器
    - http://127.0.0.1:5174   # 后台开发服务器
  allow_credentials: false
  # 内网联调期可临时置 true（放开全部来源），生产必须 false
  allow_all: false

# ── 数据采集 ─────────────────────────────────────────────────
collect:
  # ── 采集节奏（v1.2.2 起可配，默认每小时一次）────────────────────
  # hourly —— 每小时在「整点 + hourly_offset_seconds」采一次，然后做差得出上一小时用量。
  #           两个端点偏移相同 → 区间严格 1 小时，不累积偏差。
  #           代价：① 一次采样失败会连带毁掉两个小时的值；
  #                 ② 当前小时在下一个整点采样前算不出值，界面显示「待整点采集」。
  # minute —— 每 interval_seconds 秒采一次。好处是随时能给出本小时的参考值、
  #           单点失败也有冗余；代价是端点间隔会随轮次耗时漂移，
  #           小时值会稳定偏一点（月/年累计能看出来）。
  # 两种节奏的差值口径完全一致，切换不需要改代码。
  cadence: hourly
  hourly_offset_seconds: 60

  # 超时按「最坏情况要跑完一轮」倒推：单点超时 1500ms ×（1 + retry_times 1）= 3s，
  # 14 个点位全掉线也只要 42s，远小于 1 小时的采样周期。
  timeout_ms: 1500
  retry_times: 1
  retry_backoff_seconds: 0.3
  # minute 节奏下用；hourly 节奏下忽略
  interval_seconds: 60
  boundary_tolerance_minutes: 20
  readings_retention_days: 180
  filter:
    reset_threshold_ratio: 0.5

logging:
  level: INFO
  dir: logs
  file_enabled: true
  max_bytes: 52428800
  backup_count: 30

# ══════════════════════════════════════════════════════════════
# 现场设备登记表（采集侧唯一真值来源）
# ══════════════════════════════════════════════════════════════

# ── 产线 ─────────────────────────────────────────────────────
# rated（额定产能 瓶/小时）与 product（品项）属于产量侧数据，
# 产量接口本次留空，这里先置 0，待产量改造时一并回填。
# 产线主数据。
# ⚠ rated（额定产能）与 product（品项）是**静态台账参数**，不是产量数据，
#   产量未接入也要填 —— 没有它就算不出计划产量与达成率。
#   取值与 frontend/packages/shared/src/config.ts 的 linesConfig 必须同值，
#   否则大屏（读接口）与后台（读同一张表）会显示不一致。
#   现场口径若有出入，改这里一处即可（或直接在后台「生产管理」改）。
lines:
  - { code: A1, name: 一线, sort: 1, rated: 30000, product: 冰红茶 500ml }
  - { code: A2, name: 二线, sort: 2, rated: 30000, product: 绿茶 500ml }
  - { code: A3, name: 三线, sort: 3, rated: 24000, product: 茉莉蜜茶 500ml }
  - { code: A4, name: 四线, sort: 4, rated: 24000, product: 酸梅汤 500ml }
  - { code: A5, name: 五线, sort: 5, rated: 18000, product: 纯净水 550ml }
  - { code: A6, name: 六线, sort: 6, rated: 18000, product: 冰糖雪梨 500ml }

# ── 网关 ─────────────────────────────────────────────────────
# kind:
#   modbus_rtu_tcp —— 485 串口服务器。**必须用 RTU 组帧**（从站号+功能码+数据+CRC16），
#                    不是 Modbus TCP 帧；现场参考实现见 E:\http_test\serial_servier.py
#   http_api       —— 第三方数据平台的 JSON 接口
gateways:
  - code: GW-PDB-1
    name: 一期配电房串口服务器1口
    kind: modbus_rtu_tcp
    host: 10.112.66.41
    port: 8891
  - code: GW-PDB-3
    name: 一期配电房串口服务器3口
    kind: modbus_rtu_tcp
    host: 10.112.66.41
    port: 8893
  - code: GW-PDB-4
    name: 一期配电房串口服务器4口
    kind: modbus_rtu_tcp
    host: 10.112.66.41
    port: 8894
  - code: GW-TASHI
    name: 一期配电房塔石
    kind: modbus_rtu_tcp
    host: 10.112.66.133
    port: 8890
  - code: GW-API-DJ
    name: 顶津能源平台（HTTP API）
    kind: http_api
    base_url: http://47.111.74.100:8980
    timeout_ms: 8000

# ── 计量点 ───────────────────────────────────────────────────
# 电表（串口服务器）：功能码 03、起始寄存器 1000、2 个寄存器、32 位、倍率 0.1 → kWh
#   现场 13 块表已全部实测可读。`max_hourly` 是异常尖峰阈值，先给一个宽松值，
#   试运行一周后按实际用量重新标定（换表还会被「差值<0」rules 兜住，不依赖它）。
meters:
  # ── 一线 ──
  - { code: E-A1-01, name: 一线 生产线电表, kind: elec, scope: line, role: line, line: A1, gateway: GW-PDB-4, slave: 8,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A1-02, name: 一线 吹瓶机电表, kind: elec, scope: line, role: aux,  line: A1, gateway: GW-PDB-4, slave: 6,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  # ── 二线 ──
  - { code: E-A2-01, name: 二线 生产线电表, kind: elec, scope: line, role: line, line: A2, gateway: GW-PDB-3, slave: 7,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A2-02, name: 二线 吹瓶机电表, kind: elec, scope: line, role: aux,  line: A2, gateway: GW-PDB-3, slave: 5,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  # ── 三线（两块生产线表 + 一块吹瓶机表）──
  - { code: E-A3-01, name: 三线 生产线1电表, kind: elec, scope: line, role: line, line: A3, gateway: GW-PDB-1, slave: 13, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A3-02, name: 三线 生产线2电表, kind: elec, scope: line, role: line, line: A3, gateway: GW-PDB-1, slave: 15, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A3-03, name: 三线 吹瓶机电表,  kind: elec, scope: line, role: aux,  line: A3, gateway: GW-PDB-1, slave: 6,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  # ── 四线 ──
  - { code: E-A4-01, name: 四线 生产线电表, kind: elec, scope: line, role: line, line: A4, gateway: GW-TASHI, slave: 11, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  # ── 五线（生产线 + 吹瓶机 + 冰水机）──
  - { code: E-A5-01, name: 五线 生产线电表, kind: elec, scope: line, role: line, line: A5, gateway: GW-PDB-1, slave: 8,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A5-02, name: 五线 吹瓶机电表, kind: elec, scope: line, role: aux,  line: A5, gateway: GW-PDB-1, slave: 7,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A5-03, name: 五线 冰水机电表, kind: elec, scope: line, role: aux,  line: A5, gateway: GW-TASHI, slave: 14, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  # ── 六线 ──
  - { code: E-A6-01, name: 六线 生产线电表, kind: elec, scope: line, role: line, line: A6, gateway: GW-TASHI, slave: 10, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A6-02, name: 六线 吹瓶机电表, kind: elec, scope: line, role: aux,  line: A6, gateway: GW-TASHI, slave: 7,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }

  # ── 车间级总表（只有总表，不拆到线别，也就没有均摊问题）──
  - code: S-WS-01
    name: 一期蒸汽表1#
    kind: steam
    scope: workshop
    role: total
    gateway: GW-API-DJ
    url_path: /js/a/at/yewushishi/atYewushuju/Data_dingjin
    params: { cid: 135, token: CHANGE_ME }      # ← 用 settings.local.yaml 填真值
    value_path: data.0.device_data.var1          # 累计蒸汽量
    time_path: data.0.device_data.collect_time   # 平台采集时间
    scale: 1
    unit: t
    max_hourly: 100
    remark: var2/var3/var4 为瞬时参数（流量/温度/压力），已随原始响应留档

  # ⚠ 车间进水总表：现场尚未提供接口地址与令牌，先登记不采集。
  #   拿到后把 url_path / params / value_path 补齐、enabled 改 true 即可，无需改代码。
  - code: W-WS-01
    name: 车间进水总表
    kind: water
    scope: workshop
    role: total
    gateway: GW-API-DJ
    url_path: CHANGE_ME
    params: { cid: 0, token: CHANGE_ME }
    value_path: CHANGE_ME
    time_path: CHANGE_ME
    scale: 1
    unit: t
    max_hourly: 500
    enabled: false
    remark: 接入方式待现场确认（接口地址 / cid / token），暂不采集

# ── 业务阈值默认值 ───────────────────────────────────────────
# 上线后以数据库/后台的「系统参数」为准，这里只是首次初始化的默认值。
# ⚠ 产量未接入前，与产量相关的强度参数（单位电耗、水/汽耗强度）无法标定，
#   先留空；等产量改造完成、且有一周以上真实数据后再回归拟合。
energy_defaults:
  # 单线基础负荷 kWh/h —— 产量未接入期间用于判定「运行中 / 低负荷 / 无用电」
  base_load_kwh_per_hour: 20
  target_unit_kwh: 0            # 单位电耗考核目标 kWh/千瓶（待回填）
  alarm_unit_kwh_high: 0        # 单位电耗告警上限（待回填）
  output_low_rate: 0.75         # 低产判定（占额定比）
