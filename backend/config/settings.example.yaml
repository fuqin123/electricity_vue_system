# ── 业务阈值默认值 ───────────────────────────────────────────
# 上线后以数据库/后台的「系统参数」为准，这里只是首次初始化的默认值。
# ⚠ 产量未接入前，与产量相关的强度参数（单位电耗、水/汽耗强度）无法标定，
#   先留空；等产量改造完成、且有一周以上真实数据后再回归拟合。
energy_defaults:
  # 单线基础负荷 kWh/h —— 产量未接入期间用于判定「运行中 / 低负荷 / 无用电」
  base_load_kwh_per_hour: 20
  target_unit_kwh: 0            # 单位电耗考核目标 kWh/千瓶（待回填）
  alarm_unit_kwh_high: 0        # 单位电耗告警上限（待回填）
  output_low_rate: 0.75         # 低产判定（占额定比）
