  - { code: E-A6-01, name: 六线生产线电表,      kind: elec, scope: line, role: line, line: A6, usage_type: 生产线用电, device_name: 生产线,  gateway: GW-TASHI, slave: 10, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
