# ══════════════════════════════════════════════════════════════
# 能源产效管理系统 · 后端配置示例
#
# 使用方式：
#   cp config/settings.example.yaml config/settings.local.yaml
#   然后填写真实值。settings.local.yaml 已在 .gitignore 中，不会入库。
#
# 配置优先级（《项目规范》5.3）：环境变量 > 配置文件 > 默认值
#   常用环境变量：EEP_DB_PASSWORD / EEP_DB_HOST / EEP_SECRET_KEY / EEP_DEBUG
#
# ⚠ 严禁把生产口令、平台 token 提交进代码库。
#   下面的 gateways / meters 就是「现场设备登记表」——
#   改完执行 `python manage.py seed_registry` 同步进数据库（幂等，可重复跑）。
# ══════════════════════════════════════════════════════════════

app:
  name: 能源产效管理系统
  code: PLANT01
  env: development
  debug: false
  allowed_hosts:
    - 127.0.0.1
    - localhost

# ── 数据库（MySQL）───────────────────────────────────────────
database:
  engine: mysql
  host: 127.0.0.1
  port: 3306
  name: eep_energy
  user: root
  password: CHANGE_ME         # ← 用环境变量 EEP_DB_PASSWORD 覆盖，不要在此写真实口令
  conn_max_age: 60

# ── 跨域（大屏 / 后台分属不同端口）───────────────────────────
cors:
  allowed_origins:
    - http://127.0.0.1:5173   # 大屏开发服务器
    - http://127.0.0.1:5174   # 后台开发服务器
  allow_credentials: false
  # 内网联调期可临时置 true（放开全部来源），生产必须 false
  allow_all: false

# ── 数据采集 ─────────────────────────────────────────────────
collect:
  # ── 采集节奏（v1.2.2 起可配，默认每小时一次）────────────────────
  # hourly —— 每小时在「整点 + hourly_offset_seconds」采一次，然后做差得出上一小时用量。
  #           两个端点偏移相同 → 区间严格 1 小时，不累积偏差。
  #           代价：① 一次采样失败会连带毁掉两个小时的值；
  #                 ② 当前小时在下一个整点采样前算不出值，界面显示「待整点采集」。
  # minute —— 每 interval_seconds 秒采一次。好处是随时能给出本小时的参考值、
  #           单点失败也有冗余；代价是端点间隔会随轮次耗时漂移，
  #           小时值会稳定偏一点（月/年累计能看出来）。
  # 两种节奏的差值口径完全一致，切换不需要改代码。
  cadence: hourly
  hourly_offset_seconds: 60

  # 超时按「最坏情况要跑完一轮」倒推：单点超时 1500ms ×（1 + retry_times 1）= 3s，
  # 14 个点位全掉线也只要 42s，远小于 1 小时的采样周期。
  timeout_ms: 1500
  retry_times: 1
  retry_backoff_seconds: 0.3
  # minute 节奏下用；hourly 节奏下忽略
  interval_seconds: 60
  boundary_tolerance_minutes: 20
  readings_retention_days: 180
  # 采集停摆告警阈值（小时）：最新读数超过这么久没更新就在大屏挂告警。
  # 每小时节奏下最新读数最旧也就约 1 小时前，给 2 小时足够宽松；
  # 没有这条，采集整体停掉时界面不会有任何提示（各点位 last_ok 仍是上次的 True）。
  stale_alert_hours: 2
  # 网关「离线」判定阈值（分钟）。留空 = 按采集节奏自动取：
  # hourly → 90 分钟（1 个周期 + 30 分钟宽限）；minute → max(5 分钟, 3 × interval_seconds)。
  # ⚠ 不要按「分钟级」直觉填 5：hourly 节奏下心跳间隔本来就是 1 小时，
  #   填 5 会让全部网关在近乎所有时间显示离线（v1.4.4 修复过的现场问题）。
  # gateway_offline_minutes: 90
  filter:
    reset_threshold_ratio: 0.5

logging:
  level: INFO
  dir: logs
  file_enabled: true
  max_bytes: 52428800
  backup_count: 30

# ══════════════════════════════════════════════════════════════
# 现场设备登记表（采集侧唯一真值来源）
# ══════════════════════════════════════════════════════════════

# ── 车间（组织节点）─────────────────────────────────────────
# ⚠ v1.5.2 起支持多车间。每个车间在 `production_line` 表里是一条
#   `node_type='workshop'` 的记录，车间总表（水/汽）挂它。
#   产线（下面的 `lines`）通过 `workshop` 字段指定上级车间。
#   一期只启用碳水车间；制造车间留一条注释，现场上线时取消注释即可。
workshops:
  - { code: WS-CARB, name: 碳水车间, sort: 10, enabled: true }
  # - { code: WS-MANU, name: 制造车间, sort: 20, enabled: true }

# ── 产线 ─────────────────────────────────────────────────────
# rated（额定产能 瓶/小时）与 product（品项）是**静态台账参数**，不是产量数据，
# 产量未接入也要填 —— 没有它就算不出计划产量与达成率。
#   取值与 frontend/packages/shared/src/config.ts 的 linesConfig 必须同值，
#   否则大屏（读接口）与后台（读同一张表）会显示不一致。
#   现场口径若有出入，改这里一处即可（或直接在后台「生产管理」改）。
#
# ⚠ `workshop` 指向 workshops 段的 code。现场确认 **A1—A6 全部属于碳水车间**。
lines:
  - { code: A1, name: 一线, sort: 1, rated: 30000, product: 冰红茶 500ml, workshop: WS-CARB }
  - { code: A2, name: 二线, sort: 2, rated: 30000, product: 绿茶 500ml,   workshop: WS-CARB }
  - { code: A3, name: 三线, sort: 3, rated: 24000, product: 茉莉蜜茶 500ml, workshop: WS-CARB }
  - { code: A4, name: 四线, sort: 4, rated: 24000, product: 酸梅汤 500ml, workshop: WS-CARB }
  - { code: A5, name: 五线, sort: 5, rated: 18000, product: 纯净水 550ml, workshop: WS-CARB }
  - { code: A6, name: 六线, sort: 6, rated: 18000, product: 冰糖雪梨 500ml, workshop: WS-CARB }

# ── 辅助计量单元（车间下的非产线计量组）──────────────────────
# 「辅机 / 瓶胚 / 调配」这些用电不属于任何单条产线，但也**不是车间总表** ——
# 它们记在车间下的一条 `node_type='aux'` 节点上，计入车间合计，但不参与
# 产量与分摊分母（见 docs/车间归属与能耗分摊设计-草案v0.1.md）。
# 现场接口表里 `线别` 列写的是「1号高压机+3台低压机…」这类设备组合名，
# 归到哪个 aux 节点由下面的 `node` 字段决定。
aux_nodes:
  - { code: AUX-CARB-AIR,  name: 辅机-空压冰水, sort: 31, workshop: WS-CARB }
  - { code: AUX-CARB-PREFORM, name: 辅机-瓶胚, sort: 32, workshop: WS-CARB }
  - { code: AUX-CARB-BLEND,   name: 辅机-调配, sort: 33, workshop: WS-CARB }

# ── 网关 ─────────────────────────────────────────────────────
# kind:
#   modbus_rtu_tcp —— 485 串口服务器。**必须用 RTU 组帧**（从站号+功能码+数据+CRC16），
#                    不是 Modbus TCP 帧；现场参考实现见 E:\http_test\serial_servier.py
#   http_api       —— 第三方数据平台的 JSON 接口
#
# ⚠ 现场 IP 与端口以《能源管理平台网关接口配置.md》为准（2026-10 更新）：
#   · 10.112.66.41:8891 / 8893 / 8894 —— 一期配电房串口服务器 1/3/4 口
#   · 10.112.66.133:8890              —— 一期配电房塔石
#   · 10.114.1.40:8891                —— 二期配电房 1# 变压器（★ 部分网络环境不通，
#                                        正式部署环境正常；采集失败会正常记 last_error）
#   · 10.114.1.71:10123               —— 市政水表 1（Modbus TCP，从站 5、起始地址 68）
gateways:
  - code: GW-PDB-1
    name: 一期配电房串口服务器1口
    kind: modbus_rtu_tcp
    host: 10.112.66.41
    port: 8891
  - code: GW-PDB-3
    name: 一期配电房串口服务器3口
    kind: modbus_rtu_tcp
    host: 10.112.66.41
    port: 8893
  - code: GW-PDB-4
    name: 一期配电房串口服务器4口
    kind: modbus_rtu_tcp
    host: 10.112.66.41
    port: 8894
  - code: GW-TASHI
    name: 一期配电房塔石
    kind: modbus_rtu_tcp
    host: 10.112.66.133
    port: 8890
  - code: GW-PDB2-T1
    name: 二期配电房1#变压器
    kind: modbus_rtu_tcp
    host: 10.114.1.40
    port: 8891
    remark: 现场部分网络不通，正式部署环境正常（见接口表备注）
  - code: GW-WATER-CTY
    name: 市政水表1
    kind: modbus_rtu_tcp
    host: 10.114.1.71
    port: 10123
    remark: 碳水市政水表1；从站 5、起始地址 68（不是常规的 1000）
  - code: GW-API-DJ
    name: 顶津能源平台（HTTP API）
    kind: http_api
    base_url: http://47.111.74.100:8980
    timeout_ms: 8000

# ── 计量点 ───────────────────────────────────────────────────
# 电表（串口服务器）：功能码 03、**2 个寄存器、32 位、倍率 0.1 → kWh**。
#   起始地址**跟仪表走**：现场绝大多数是 1000，但市政水表是 68（见下），
#   所以 `register` 必须逐条显式写，不能靠默认值。
#
# 字段说明（新增三个，供后台「车间 → 类型 → 设备」三级筛选）：
#   · workshop     —— 冗余留档，实际归属由 `line` / `node` 决定
#   · usage_type   —— 用能类型（生产线用电 / 辅机用电 / 瓶胚用电 / 调配用电）
#   · device_name  —— 设备名（吹瓶机 / 冰水机和水塔 / 溶糖CIP …）
#   · line         —— 挂到产线（A1—A6）
#   · node         —— 挂到辅助计量单元（aux_nodes 段的 code）
#
# 现场接口表里的「线别」对辅机类设备写的是设备组合名，因此下面用 `node`
# 而不是 `line` 挂靠；`device_name` 保留现场原文，界面第三级直接显示它。
meters:
  # ══ 生产线用电（挂产线）══
  - { code: E-A1-01, name: 一线生产线电表,      kind: elec, scope: line, role: line, line: A1, usage_type: 生产线用电, device_name: 生产线,  gateway: GW-PDB-4, slave: 8,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A1-02, name: 一线吹瓶机电表,      kind: elec, scope: line, role: aux,  line: A1, usage_type: 生产线用电, device_name: 吹瓶机,  gateway: GW-PDB-4, slave: 6,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A2-01, name: 二线生产线电表,      kind: elec, scope: line, role: line, line: A2, usage_type: 生产线用电, device_name: 生产线,  gateway: GW-PDB-3, slave: 7,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A2-02, name: 二线吹瓶机电表,      kind: elec, scope: line, role: aux,  line: A2, usage_type: 生产线用电, device_name: 吹瓶机,  gateway: GW-PDB-3, slave: 5,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A3-01, name: 三线生产线1电表,     kind: elec, scope: line, role: line, line: A3, usage_type: 生产线用电, device_name: 生产线1, gateway: GW-PDB-1, slave: 13, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A3-02, name: 三线生产线2电表,     kind: elec, scope: line, role: line, line: A3, usage_type: 生产线用电, device_name: 生产线2, gateway: GW-PDB-1, slave: 15, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A3-03, name: 三线吹瓶机电表,      kind: elec, scope: line, role: aux,  line: A3, usage_type: 生产线用电, device_name: 吹瓶机,  gateway: GW-PDB-1, slave: 6,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A4-01, name: 四线生产线电表,      kind: elec, scope: line, role: line, line: A4, usage_type: 生产线用电, device_name: 生产线,  gateway: GW-TASHI, slave: 11, register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A5-01, name: 五线生产线电表,      kind: elec, scope: line, role: line, line: A5, usage_type: 生产线用电, device_name: 生产线,  gateway: GW-PDB-1, slave: 8,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
  - { code: E-A5-02, name: 五线吹瓶机电表,      kind: elec, scope: line, role: aux,  line: A5, usage_type: 生产线用电, device_name: 吹瓶机,  gateway: GW-PDB-1, slave: 7,  register: 1000, registers: 2, scale: 0.1, unit: kWh, max_hourly: 5000 }
