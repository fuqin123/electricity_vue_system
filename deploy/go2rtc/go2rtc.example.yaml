# ══════════════════════════════════════════════════════════════
# go2rtc 配置模板 —— 浏览器视频监控的转流网关
#
# 现状：现场已在 E:\能源产效管理平台\go2rtc_win64 验证通过。
#       大屏通过内置播放页以 <iframe> 方式播放，链路稳定。
#
# 使用方式：
#   cp go2rtc.example.yaml <go2rtc目录>/go2rtc.yaml
#   修改 streams 下的摄像头地址，然后重启 go2rtc。
#
# ⚠ 为什么不直接把 rtsp:// 填进前端？
#   浏览器不支持 rtsp 协议。必须由本网关转成 MSE / WebRTC / HLS / MJPEG
#   之一，浏览器才能播放。这一步与前端无关，是部署环节的事。
# ══════════════════════════════════════════════════════════════

# ── HTTP API、内置播放页、MSE / HLS / MJPEG 全部走这个端口 ────
api:
  listen: ":1984"
  # ⚠ 允许跨域：前端直连网关取流时需要。
  #   生产环境建议改为前端实际地址，例如 "http://10.20.31.100"
  origin: "*"
  # 如需给 API 加访问口令（防止内网任意人拉流），取消下面注释
  # username: eep
  # password: CHANGE_ME

# ── WebRTC（延迟最低，但需额外放开此端口且受 NAT 影响）────────
#    默认不使用；只有当前端把 webrtc 排在 prefer 首位时才需要
webrtc:
  listen: ":8555"
  # 若网关在 NAT 后，需声明可被外部访问的地址
  # candidates:
  #   - 10.113.1.61:8555

# ── HLS（兼容性最好，延迟 3—8s）─────────────────────────────
hls:
  # 切片时长，越小延迟越低但请求越多
  segment_duration: 2s

# ── RTSP 服务端口（供录像机等再拉流，前端不用）──────────────
rtsp:
  listen: ":8554"

# ── 日志 ────────────────────────────────────────────────────
log:
  level: info          # trace | debug | info | warning | error

# ══════════════════════════════════════════════════════════════
# 摄像头流定义
#
# ⚠ 这里的 key（如 my_camera / a2）就是「流名称」，
#   必须与前端 frontend/packages/shared/src/config.ts 中
#   videoConfig.channels.<产线>.stream 完全一致，否则前端会报「流名不存在」。
#
# 海康地址格式：  rtsp://用户名:密码@IP:554/Streaming/Channels/<通道号>
#   主码流： 101（通道1）/ 201（通道2）/ 301（通道3）
#   子码流： 102 / 202 / 302   ← 大屏墙挂建议用子码流，省带宽、更流畅
# 大华地址格式：  rtsp://用户名:密码@IP:554/cam/realmonitor?channel=1&subtype=0
# ══════════════════════════════════════════════════════════════

streams:
  # 当前现场唯一一路摄像头（海康，子码流）
  my_camera:
    - rtsp://admin:密码@10.113.1.118:554/Streaming/Channels/102

  # ── 以下为待接入产线的模板，摄像头到位后取消注释并核对 IP / 通道号 ──
  # 然后在 config.ts 中把对应产线的 stream 改成 a2、enabled 改为 true
  #
  # a2:
  #   - rtsp://admin:密码@10.113.1.119:554/Streaming/Channels/102
  # a3:
  #   - rtsp://admin:密码@10.113.1.120:554/Streaming/Channels/102
  # a4:
  #   - rtsp://admin:密码@10.113.1.121:554/Streaming/Channels/102
  # a5:
  #   - rtsp://admin:密码@10.113.1.122:554/Streaming/Channels/102
  # a6:
  #   - rtsp://admin:密码@10.113.1.123:554/Streaming/Channels/102

# ══════════════════════════════════════════════════════════════
# 使用提醒
# ══════════════════════════════════════════════════════════════
#
# ① 摄像头并发路数有限
#    海康/大华默认并发路数常见 4—6 路。同一路流被多个页面同时观看会各占一份并发。
#    大屏与后台「视频监控」页不要长时间同时预览同一路。
#
# ② 按需拉流
#    go2rtc 默认仅在有观看方时拉流，无人观看自动断开（无需额外配置）。
#    这正好契合大屏「只在打开单线详情时才播放」的用法。
#
# ③ 服务化（Windows）
#    用 deploy/windows/nssm-install.ps1 把 go2rtc 注册为 Windows 服务，
#    实现开机自启与崩溃自动重启。
#
# ④ 前端协议优先级
#    默认 mse → webrtc → hls → mjpeg。mse 只用 1984 端口且延迟 0.5—2s，
#    是不放开 8555 时的最优解。调整顺序改 config.ts 的 videoConfig.prefer。
#
# ⑤ 自检地址（浏览器直接打开即可验证网关是否正常）
#    http://<网关IP>:1984/                     go2rtc 首页
#    http://<网关IP>:1984/api/streams          流列表（后台「检测网关」用的就是它）
#    http://<网关IP>:1984/stream.html?src=my_camera&mode=mse    MSE 播放页
#    http://<网关IP>:1984/api/frame.jpeg?src=my_camera          抓图
