# ══════════════════════════════════════════════════════════════
# 能源产效管理系统 · Nginx 站点配置
#
# 用法：
#   sudo cp deploy/nginx/eep.conf /etc/nginx/conf.d/eep.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 部署路径约定：
#   大屏  /screen/   hash 路由，无需 rewrite
#   后台  /admin/    history 路由，必须 try_files 回退
#   API   /api/      反向代理到 Django
#   视频  /live/     反向代理到 go2rtc（长连接，必须关缓冲）
#
# ⚠ 若后台部署在站点根目录（不是 /admin/），需同步修改：
#   ① 本文件的 location / 与 try_files 目标
#   ② frontend/apps/admin/vite.config.ts 的 base
# ══════════════════════════════════════════════════════════════

# ── 后端 Django（只监听回环，不直接对外）─────────────────────
upstream eep_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ── go2rtc 视频网关 ─────────────────────────────────────────
upstream eep_stream {
    server 127.0.0.1:1984;
    keepalive 16;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    charset      utf-8;
    root         /opt/eep;
    index        index.html;

    # 报表导入等上传
    client_max_body_size 20m;

    access_log   /var/log/nginx/eep-access.log  main;
    error_log    /var/log/nginx/eep-error.log   warn;

    # ── 安全响应头 ─────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header X-Frame-Options         "SAMEORIGIN"  always;
    add_header Referrer-Policy         "same-origin" always;
    server_tokens off;

    # ── gzip（大屏 JS 约 1MB，收益显著）─────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff2;

    # ══════════════════════════════════════════════════════
    # 大屏（hash 路由，不需要服务端 rewrite）
    # ══════════════════════════════════════════════════════
    location /screen/ {
        alias /opt/eep/screen/;
        try_files $uri $uri/ /screen/index.html;

        # 带内容哈希的产物文件名 → 长期强缓存
        location ~* ^/screen/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|svg|ico)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 入口文件绝不缓存，保证发版即生效
        location = /screen/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
    }

    location = /screen { return 301 /screen/; }

    # ══════════════════════════════════════════════════════
    # 后台管理（history 路由）
    # ══════════════════════════════════════════════════════
    location /admin/ {
        alias /opt/eep/admin/;

        # ★★★ 关键：未命中的路径回退到 index.html
        #     漏掉这一行 → 首页能开、刷新任意子路由 404
        try_files $uri $uri/ /admin/index.html;

        location ~* ^/admin/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|svg|ico)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
    }

    location = /admin { return 301 /admin/; }

    # ══════════════════════════════════════════════════════
    # 后端 API
    # ══════════════════════════════════════════════════════
    location /api/ {
        proxy_pass          http://eep_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";

        proxy_connect_timeout  10s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # 接口一律不缓存
        add_header Cache-Control "no-store";
    }

    # 后端静态资源（Django admin / Swagger UI）
    location /static/ {
        proxy_pass http://eep_backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ══════════════════════════════════════════════════════
    # 视频转流（go2rtc）—— FLV / MSE / HLS 均为长连接
    #
    # 说明：前端默认直连 go2rtc（10.113.1.61:1984），不经过本段配置。
    #       仅当希望通过统一入口收敛端口、或给视频加访问控制时才启用，
    #       并把 config.ts 的 videoConfig.go2rtc.base 改为 http://<本机>/live
    # ══════════════════════════════════════════════════════
    location /live/ {
        proxy_pass          http://eep_stream/;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;

        # ⚠ 长连接三件套：不关缓冲、放宽读超时，画面几秒就会断
        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       3600s;
        proxy_send_timeout       3600s;
        chunked_transfer_encoding off;

        # MSE 走 WebSocket，需要协议升级
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 允许前端跨域拉流
        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    }

    # ══════════════════════════════════════════════════════
    # 其他
    # ══════════════════════════════════════════════════════
    location = / { return 302 /admin/; }

    # 健康检查（供监控系统探测）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # 屏蔽敏感文件
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(tar|tar\.gz|zip|sql|bak|log)$ { deny all; }
}
