# ══════════════════════════════════════════════════════════════
# 能源产效管理系统 · Nginx 配置（容器内）
#
# 与 deploy/nginx/eep.conf 的唯一区别：静态资源根目录
#   宿主机：/opt/eep/{screen,admin}
#   容器内：/usr/share/nginx/html/{screen,admin}
#
# ⚠ 改配置时两处都要改，避免「容器里能跑、宿主机部署 404」。
# ══════════════════════════════════════════════════════════════

upstream eep_backend {
    server backend:8000;          # docker compose 服务名
    keepalive 32;
}

upstream eep_stream {
    server stream:1984;           # go2rtc 容器
    keepalive 16;
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    charset      utf-8;
    root         /usr/share/nginx/html;
    index        index.html;

    client_max_body_size 20m;

    access_log  /var/log/nginx/eep-access.log  main;
    error_log   /var/log/nginx/eep-error.log   warn;

    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;
    server_tokens off;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/xml image/svg+xml font/woff2;

    # ── 大屏（hash 路由）──────────────────────────────────
    location /screen/ {
        alias /usr/share/nginx/html/screen/;
        try_files $uri $uri/ /screen/index.html;

        location ~* ^/screen/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|svg|ico)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /screen/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
    }
    location = /screen { return 301 /screen/; }

    # ── 后台（history 路由，必须回退）─────────────────────
    location /admin/ {
        alias /usr/share/nginx/html/admin/;

        # ★ 关键
        try_files $uri $uri/ /admin/index.html;

        location ~* ^/admin/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|svg|ico)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
    }
    location = /admin { return 301 /admin/; }

    # ── 后端 API ──────────────────────────────────────────
    location /api/ {
        proxy_pass          http://eep_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        add_header Cache-Control "no-store";
    }

    location /static/ {
        proxy_pass http://eep_backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ── 视频（go2rtc 长连接）──────────────────────────────
    location /live/ {
        proxy_pass          http://eep_stream/;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_buffering          off;
        proxy_cache              off;
        proxy_read_timeout       3600s;
        chunked_transfer_encoding off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Access-Control-Allow-Origin * always;
    }

    location = / { return 302 /admin/; }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ /\.(?!well-known) { deny all; }
}
