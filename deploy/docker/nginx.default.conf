# ══════════════════════════════════════════════════════════════
# 能源产效管理系统 · Nginx 配置（容器内）
#
# 与 deploy/nginx/eep.conf 的两处区别：
#   ① 静态资源根目录
#        宿主机：/opt/eep/{screen,admin}
#        容器内：/usr/share/nginx/html/{screen,admin}
#   ② 后端/视频网关用「运行时解析」，不是 upstream 静态块
#
# ⚠ 改配置时两处都要改，避免「容器里能跑、宿主机部署 404」。
#
# ── 为什么不能用 upstream{} 静态块（v1.4.0 踩过的坑）──────────
#   upstream { server backend:8000; } 会在 **nginx 启动瞬间** 解析主机名。
#   后端容器没起来（或只单独跑前端）时，nginx 直接
#     [emerg] host not found in upstream "backend"
#   → 前端容器 crash loop，页面整体打不开，而真正的故障只在后端。
#   改成 resolver + 变量形式的 proxy_pass：DNS 推迟到 **请求时** 才解析，
#   后端不在也只是 /api 返回 502，大屏/后台静态页面照常能开
#   （前端有 mock 兜底，不会白屏）。
#   依赖 compose 自定义网络（eep-net），Docker 内置 DNS 才是 127.0.0.11。
# ══════════════════════════════════════════════════════════════

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    charset      utf-8;
    root         /usr/share/nginx/html;
    index        index.html;

    client_max_body_size 20m;

    # 不指定 log_format 名称：容器里的 nginx.conf 未必定义 main，
    # 写 main 会让 nginx -t 直接失败。
    access_log  /var/log/nginx/eep-access.log;
    error_log   /var/log/nginx/eep-error.log   warn;

    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "same-origin" always;
    server_tokens off;

    # ── Docker 内置 DNS（运行时解析服务名）──────────────────
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/xml image/svg+xml font/woff2;

    # ── 大屏（hash 路由）──────────────────────────────────
    #    构建时 base 为 './'，产物内的资源引用是相对路径，
    #    所以必须带尾斜杠访问（下面有 301 兜住 /screen）。
    location /screen/ {
        alias /usr/share/nginx/html/screen/;
        try_files $uri $uri/ /screen/index.html;

        location ~* ^/screen/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|svg|ico)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /screen/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
    }
    location = /screen { return 301 $scheme://$http_host/screen/; }

    # ── 后台（history 路由，必须回退）─────────────────────
    #    产物用 --base=/admin/ 构建，资源前缀与这里的 alias 一致。
    location /admin/ {
        alias /usr/share/nginx/html/admin/;

        # ★ 关键：不配这行就是「首页能开、刷新任意子路由 404」
        try_files $uri $uri/ /admin/index.html;

        location ~* ^/admin/assets/.*\.(js|css|woff2?|ttf|png|jpe?g|svg|ico)$ {
            expires 365d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        location = /admin/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }
    }
    location = /admin { return 301 $scheme://$http_host/admin/; }

    # ── 后端 API ──────────────────────────────────────────
    #    proxy_pass 带变量且不写 URI → 原始请求路径原样透传
    #    （Django 的路由本身就挂在 /api/energy/ 与 /api/admin/ 下）。
    location /api/ {
        set $eep_backend eep-backend:8000;
        proxy_pass          http://$eep_backend;
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        add_header Cache-Control "no-store";
    }

    # 后端静态资源（whitenoise / DEBUG 模式下的 django staticfiles）
    location /static/ {
        set $eep_backend eep-backend:8000;
        proxy_pass http://$eep_backend;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ── 视频（go2rtc 长连接）──────────────────────────────
    #    /live/api/stream.m3u8 → go2rtc 的 /api/stream.m3u8，
    #    所以要先剥掉 /live/ 前缀；rewrite + break 与变量 proxy_pass
    #    配合，把改写后的 URI 送出去。
    location /live/ {
        set $eep_stream eep-stream:1984;
        rewrite ^/live/(.*)$ /$1 break;
        proxy_pass             http://$eep_stream;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;
        chunked_transfer_encoding off;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        add_header Access-Control-Allow-Origin * always;
    }

    location = / { return 302 $scheme://$http_host/admin/; }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~ /\.(?!well-known) { deny all; }
}
